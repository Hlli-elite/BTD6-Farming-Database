<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Decryptor</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Load CryptoJS first from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js" 
            integrity="sha512-E8QSvWZ0eCLGk4km3hxSsNmGWbLtSCSUcewDQPQWZF6pEU8GlT8a5fF32wOl1i8ftdMhssTrF/OhyGWwonTcXA==" 
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <!-- Load Pako second -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div class="container">
        <h1>Profile Decryptor</h1>
        <p>Select your <code>Profile.Save</code> file:</p>
        
        <input type="file" id="fileInput">
        <br><br>
        <button id="decryptButton">Decrypt & Preview</button>
        
        <div id="output"></div>
    </div>

    <!-- Finally, load your custom script -->
    <script src="script.js"></script>
</body>
</html>
